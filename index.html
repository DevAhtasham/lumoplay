<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumoPlay - Test</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      color: #333;
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/controls.css">
  <link rel="stylesheet" href="./src/styles/overlay.css">
  <link rel="stylesheet" href="./src/styles/themes.css">
</head>
<body>
  <div class="container">
    <h1>LumoPlay - Test</h1>
    
    <div class="player-wrapper">
      <div id="player" class="lumoplay"></div>
    </div>
  </div>

  <script type="module">
    import { LumoPlayer } from './src/index.ts';

    // Initialize player with thumbnail support
    const player = new LumoPlayer('#player', {
      src: 'https://media.w3.org/2010/05/sintel/trailer.mp4',
      poster: 'https://media.w3.org/2010/05/sintel/poster.png',
      autoplay: false,
      muted: false,
      controls: true,
      theme: 'dark',
      autoHideDelay: 3000,
      thumbnails: {
        enabled: true,
        type: 'webvtt',
        source: './examples/thumbnails.vtt'
      }
    });

    // Event listeners
    player.on('play', () => console.log('Video started playing'));
    player.on('pause', () => console.log('Video paused'));
    player.on('ended', () => console.log('Video ended'));
    player.on('seek', ({ time }) => console.log('Seeked to', time));
    player.on('timeupdate', ({ time }) => console.log('Current time:', time));

    // Thumbnail events
    player.on('thumbnailHover', ({ time, thumbnail }) => {
      console.log('Thumbnail hover at time:', time, 'thumbnail:', thumbnail);
    });

    player.on('thumbnailLoad', ({ success, count }) => {
      console.log('Thumbnails loaded:', success, 'count:', count);
    });
  </script>
</body>
</html>
