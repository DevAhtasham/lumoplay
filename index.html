<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumoPlay - Test</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      color: #333;
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/controls.css">
  <link rel="stylesheet" href="./src/styles/overlay.css">
  <link rel="stylesheet" href="./src/styles/themes.css">
</head>
<body>
  <div class="container">
    <h1>LumoPlay - Test</h1>
    
    <div class="player-wrapper">
      <div id="player" class="lumoplay"></div>
    </div>
  </div>

  <script type="module">
    import { LumoPlayer } from './src/index.ts';

    /**
     * VideoFrameCapture - captures actual frames from the video source
     * Uses a hidden <video> + <canvas> to extract real frame images
     */
    class VideoFrameCapture {
      constructor(videoSrc, interval = 2) {
        this.interval = interval;
        this.frameCache = new Map();
        this.pendingCaptures = new Set();

        this.video = document.createElement('video');
        this.video.src = videoSrc;
        this.video.crossOrigin = 'anonymous';
        this.video.muted = true;
        this.video.preload = 'metadata';
        this.video.style.cssText = 'position:absolute;visibility:hidden;width:1px;height:1px;';
        document.body.appendChild(this.video);

        this.canvas = document.createElement('canvas');
        this.canvas.width = 160;
        this.canvas.height = 90;
        this.ctx = this.canvas.getContext('2d');

        this.ready = false;
        this.capturing = false;

        this.video.addEventListener('loadedmetadata', () => {
          this.ready = true;
          this.duration = this.video.duration;
          this.precaptureAll();
        });
      }

      captureAt(time) {
        const bucket = Math.round(time / this.interval) * this.interval;
        const key = bucket.toFixed(1);

        if (this.frameCache.has(key)) {
          return Promise.resolve(this.frameCache.get(key));
        }

        if (this.pendingCaptures.has(key)) {
          return new Promise(resolve => {
            const check = setInterval(() => {
              if (this.frameCache.has(key)) {
                clearInterval(check);
                resolve(this.frameCache.get(key));
              }
            }, 50);
          });
        }

        return this._captureFrame(key, bucket);
      }

      _captureFrame(key, time) {
        this.pendingCaptures.add(key);
        return new Promise((resolve) => {
          const clampedTime = Math.max(0, Math.min(time, this.duration || 9999));
          this.video.currentTime = clampedTime;

          const onSeeked = () => {
            this.video.removeEventListener('seeked', onSeeked);
            try {
              this.ctx.drawImage(this.video, 0, 0, 160, 90);
              const dataUrl = this.canvas.toDataURL('image/jpeg', 0.7);
              this.frameCache.set(key, dataUrl);
            } catch (e) {
              this.frameCache.set(key, null);
            }
            this.pendingCaptures.delete(key);
            resolve(this.frameCache.get(key));
          };
          this.video.addEventListener('seeked', onSeeked, { once: true });
        });
      }

      async precaptureAll() {
        if (!this.ready || this.capturing) return;
        this.capturing = true;
        const totalFrames = Math.ceil(this.duration / this.interval);
        for (let i = 0; i <= totalFrames; i++) {
          const t = i * this.interval;
          const key = t.toFixed(1);
          if (!this.frameCache.has(key)) {
            await this._captureFrame(key, t);
          }
        }
        this.capturing = false;
        console.log(`[LumoPlay] Captured ${this.frameCache.size} thumbnail frames`);
      }

      destroy() {
        this.video.remove();
        this.frameCache.clear();
      }
    }

    // Initialize frame capture
    const VIDEO_SRC = '/assets/videos/trailer.webm';
    let frameCapture = new VideoFrameCapture(VIDEO_SRC, 2);

    async function getThumbnailUrl(time) {
      return await frameCapture.captureAt(time);
    }

    // Initialize player
    const player = new LumoPlayer('#player', {
      src: VIDEO_SRC,
      poster: '',
      autoplay: false,
      muted: false,
      controls: true,
      theme: 'dark',
      autoHideDelay: 3000,
    });

    // Enable thumbnails on progress bar
    const progressBar = player.getProgressBar();
    if (progressBar) {
      progressBar.enableThumbnails();
      console.log('Thumbnails enabled');

      // Listen for thumbnail requests
      progressBar.getElement().addEventListener('thumbnailRequest', async (e) => {
        const { time, x, y } = e.detail;
        const thumbnailUrl = await getThumbnailUrl(time);
        if (thumbnailUrl) {
          progressBar.showThumbnailPreview(thumbnailUrl, { x, y });
        }
      });
    }

    // Event listeners
    player.on('play', () => console.log('Video started playing'));
    player.on('pause', () => console.log('Video paused'));
    player.on('ended', () => console.log('Video ended'));
    player.on('seek', ({ time }) => console.log('Seeked to', time));
    player.on('timeupdate', ({ time }) => console.log('Current time:', time));
  </script>
</body>
</html>
