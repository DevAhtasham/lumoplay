<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumoPlay - Basic Example</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      color: #333;
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #00a8ff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: #0097e6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LumoPlay - Basic Example</h1>
    
    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <div class="controls">
      <button onclick="play()">Play</button>
      <button onclick="pause()">Pause</button>
      <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
      <button onclick="setTheme('light')">Light Theme</button>
      <button onclick="setTheme('dark')">Dark Theme</button>
    </div>
  </div>

  <script type="module">
    import { LumoPlayer } from '../build/esm/lumoplay.js';

    // Initialize player
    const player = new LumoPlayer('#player', {
      src: 'https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4',
      poster: 'https://sample-videos.com/img/Sample-jpg-image-5mb.jpg',
      autoplay: false,
      muted: false,
      controls: true,
      theme: 'dark',
      autoHideDelay: 3000,
      persistVolume: true,
      persistPosition: true,
    });

    // Make player available globally for button handlers
    window.player = player;

    // Event listeners
    player.on('play', () => console.log('Video started playing'));
    player.on('pause', () => console.log('Video paused'));
    player.on('ended', () => console.log('Video ended'));
    player.on('seek', ({ time }) => console.log('Seeked to', time));
    player.on('timeupdate', ({ time }) => console.log('Current time:', time));
  </script>

  <script>
    function play() {
      window.player.play();
    }

    function pause() {
      window.player.pause();
    }

    function toggleFullscreen() {
      window.player.toggleFullscreen();
    }

    function setTheme(theme) {
      window.player.container.setAttribute('data-theme', theme);
    }
  </script>
</body>
</html>
